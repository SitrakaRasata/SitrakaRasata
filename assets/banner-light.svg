<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 214" width="1060" height="214" role="img" aria-label="A terminal session. The command whoami returns: Sitraka Rasatarivony, full stack, system design.">
  <!--
    Generated. The light and dark variants are emitted together; changing one by
    hand desynchronises them. The session is deliberately one command long: the
    banner says who, the README below says what.

    Cold #38BDF8 marks the prompt, warm #FBBF24 marks the cursor. The cursor is
    the only thing on this page that never stops moving, which is why it is warm.
  -->
  <defs>
    <clipPath id="type">
      <rect x="54.4" y="71" width="0" height="25">
        <animate attributeName="width" from="0" to="61.199999999999996" begin="0.35s" dur="0.75s" fill="freeze" calcMode="discrete" values="0.0;10.2;20.4;30.6;40.8;51.0;61.2"/>
      </rect>
    </clipPath>
    <clipPath id="window"><rect x="1" y="1" width="1058" height="212" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect x="0" y="0" width="1060" height="214" fill="#FFFFFF"/>
    <rect x="0" y="0" width="1060" height="42" fill="#F6F8FA"/>
    <line x1="0" y1="42" x2="1060" y2="42" stroke="#D8DEE6" stroke-width="1"/>
    <g fill="#CBD3DC">
      <circle cx="26" cy="21" r="5.5"/>
      <circle cx="46" cy="21" r="5.5"/>
      <circle cx="66" cy="21" r="5.5"/>
    </g>
    <text x="1034" y="25" text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="1.6" fill="#57646F">zsh</text>

    <!-- $ whoami, typed -->
    <text x="34" y="88" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#0284C7">$</text>
    <g clip-path="url(#type)">
      <text x="54.4" y="88" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#12171D">whoami</text>
    </g>
    <rect y="73" width="10.2" height="19" fill="#B45309" opacity="0.9">
      <animate attributeName="x" begin="0.35s" dur="0.75s" fill="freeze" calcMode="discrete" values="54.4;64.6;74.8;85.0;95.2;105.4;115.6"/>
      <animate attributeName="opacity" from="0.9" to="0" begin="1.10s" dur="0.01s" fill="freeze"/>
      <set attributeName="x" to="54.4"/>
    </rect>

    <!-- output -->
    <text x="34" y="126" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#12171D" opacity="0">
      Sitraka Rasatarivony<tspan fill="#57646F"> · full stack, system design</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.18s" fill="freeze"/>
    </text>

    <!-- waiting prompt, cursor blinks for good -->
    <text x="34" y="164" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace" font-size="17" fill="#0284C7" opacity="0">$
      <animate attributeName="opacity" from="0" to="1" begin="1.80s" dur="0.12s" fill="freeze"/>
    </text>
    <rect x="54.4" y="149" width="10.2" height="19" fill="#B45309" opacity="0">
      <animate attributeName="opacity" values="0;0.9" begin="1.80s" dur="0.12s" fill="freeze"/>
      <animate attributeName="opacity" values="0.9;0.9;0;0;0.9" keyTimes="0;0.45;0.5;0.95;1" begin="1.92s" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.75" y="0.75" width="1058.5" height="212.5" rx="14" fill="none" stroke="#D8DEE6" stroke-width="1.5"/>
</svg>
