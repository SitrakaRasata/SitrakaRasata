<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300" role="img" aria-label="Sitraka Rasatarivony — Full Stack Developer, System Design. 4s to 300ms, 10+ modules in production, DevSecOps. Core stack: TypeScript, NestJS, React, PostgreSQL.">
  <!--
    Palette chosen in OKLCH, emitted as hex for GitHub-render compatibility.
    bg   oklch(0.19/0.14 0.012 65)  warm charcoal (not navy)
    acc  oklch(0.78 0.14 68)        signal amber  (not cyan/neon)
    Concept: telemetry blueprint. Amber pulse = a request flowing through the
    system (entry -> api -> service -> db -> egress), nodding to 4s->300ms.
    Right side is a drafting-style title block.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#272320"/>
      <stop offset="1" stop-color="#1A1714"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#EBAA4E" opacity="0.06"/>
    </pattern>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F6C877" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F6C877" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="1" y="1" width="1058" height="298" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1060" height="300" fill="url(#bg)"/>
    <rect x="0" y="0" width="1060" height="300" fill="url(#grid)"/>
    <rect x="0" y="0" width="460" height="300" fill="#000000" opacity="0.10"/>
    <line x1="460" y1="66" x2="460" y2="234" stroke="#4A443C" stroke-width="1" opacity="0.55"/>

    <!-- edges: a small DAG, entry -> services -> data -> egress -->
    <g stroke="#574F46" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M60,155 L150,95"/>
      <path d="M60,155 L150,215"/>
      <path d="M150,95 L255,155"/>
      <path d="M150,215 L255,155"/>
      <path d="M255,155 L355,100"/>
      <path d="M255,155 L355,210"/>
      <path d="M355,100 L425,155"/>
      <path d="M355,210 L425,155"/>
    </g>

    <!-- idle nodes -->
    <g fill="#201D1A" stroke="#8A8175" stroke-width="1.7">
      <circle cx="150" cy="95" r="5.5"/>
      <circle cx="150" cy="215" r="5.5"/>
      <circle cx="255" cy="155" r="5.5"/>
      <circle cx="425" cy="155" r="5.5"/>
    </g>

    <!-- accent nodes (entry, cache, db) with a slow breathing halo -->
    <g>
      <circle cx="60" cy="155" r="14" fill="url(#halo)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      </circle>
      <circle cx="355" cy="100" r="14" fill="url(#halo)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="1.3s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      </circle>
      <circle cx="355" cy="210" r="14" fill="url(#halo)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" begin="2.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      </circle>
      <g fill="#EBAA4E">
        <circle cx="60" cy="155" r="6.5"/>
        <circle cx="355" cy="100" r="6.5"/>
        <circle cx="355" cy="210" r="6.5"/>
      </g>
    </g>

    <!-- traveling request: entry -> api -> service -> db -> egress -->
    <g>
      <circle r="9" fill="url(#halo)"/>
      <circle r="3.5" fill="#F6C877"/>
      <animateMotion dur="3.4s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;1" keySplines="0.4 0 0.2 1"
        path="M60,155 L150,95 L255,155 L355,210 L425,155"/>
      <animate attributeName="opacity" values="0;1;1;1;0" dur="3.4s" repeatCount="indefinite" keyTimes="0;0.06;0.5;0.9;1"/>
    </g>

    <!-- name + title + proof -->
    <text x="500" y="124" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" fill="#F4F0E9">Sitraka Rasatarivony</text>

    <rect x="502" y="146" width="54" height="3" rx="1.5" fill="#EBAA4E"/>

    <text x="500" y="184" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#C7BFB4">Full Stack Developer<tspan fill="#6E665C">&#160;&#160;·&#160;&#160;</tspan>System Design</text>

    <text x="500" y="228" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace" font-size="15.5" fill="#9E9689" letter-spacing="0.2">
      <tspan fill="#EBAA4E" font-weight="600">4s&#160;→&#160;300ms</tspan><tspan>&#160;&#160;·&#160;&#160;10+ modules in prod&#160;&#160;·&#160;&#160;</tspan><tspan fill="#C7BFB4">DevSecOps</tspan>
    </text>

    <!-- drafting-style title block, right-aligned -->
    <g text-anchor="end" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Consolas', monospace">
      <text x="1018" y="160" font-size="11" letter-spacing="2.5" fill="#EBAA4E">CORE STACK</text>
      <text x="1018" y="184" font-size="14.5" fill="#B4AB9D">TypeScript</text>
      <text x="1018" y="207" font-size="14.5" fill="#B4AB9D">NestJS</text>
      <text x="1018" y="230" font-size="14.5" fill="#B4AB9D">React</text>
      <text x="1018" y="253" font-size="14.5" fill="#B4AB9D">PostgreSQL</text>
    </g>
  </g>

  <!-- card edge, so it reads as a crafted panel on light GitHub too -->
  <rect x="1" y="1" width="1058" height="298" rx="18" fill="none" stroke="#3B362F" stroke-width="1.5"/>
</svg>
